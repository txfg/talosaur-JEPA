# Onboard vision loop on the Raspberry Pi 5 (python -m talosaur.onboard.app --config configs/onboard/pi5.yaml)
model:
  export_dir: exports/tiny_ctx      # copied from the training box (scripts/export.py output)
  name: vit_tiny_112x208            # 16:9 grid (13x7) keeps the full wide field of view
  runtime: ort_int8                 # ort_int8 | ort_dyn8 | ort_fp32 | ncnn_fp16 | ncnn_int8 (pick from the benchmark)
  threads: 3                        # leave one core for camera, encoder and control

source:
  kind: picamera2                   # picamera2 | video | synthetic
  main_size: [1280, 720]            # recording stream (the model reads the ISP-scaled lores stream)
  fps: 15
  hdr: "off"                        # off | sensor (IMX708, 2304x1296 max) | isp | night (Pi 5 ISP); pool-test before use
  controls:
    AfMode: 0                       # manual focus: autofocus hunts in murky water
    LensPosition: 1.0               # dioptres; flat port: ~1.33 / d for animals d m away (1.0 = ~1.3 m); tune in the pool
    AeExposureMode: 1               # "short": less motion blur, more gain
    AwbEnable: true

recording:                          # docs/PI5.md section 6
  enabled: true
  mode: continuous                  # continuous: the whole run, never switched off | events: only around encounters
  out_dir: recordings
  bitrate: 6000000                  # 6 Mbit/s = 2.7 GB per hour
  segment_s: 300                    # continuous: a new file every 5 min, cut at a keyframe (no frames lost)
  format: mpegts                    # continuous: .ts plays up to the last frame even after a power cut
  min_free_mb: 2000                 # continuous: below this, free space by deleting the oldest footage WITHOUT animals ...
  low_disk: delete_empty            # ... (delete_empty) or stop recording (stop); animal footage is never deleted
  encoder_threads: 2                # software H.264 threads (x264 picks 6 on its own, competing with the model)
  preroll_s: 5                      # events mode only: seconds kept before each encounter

guidance:                           # tuning guide: docs/PI5.md section 11
  heat_thr: 0.5                     # a blob needs at least one patch with p(animal) >= this ...
  heat_thr_low: 0.35                # ... and extends over connected patches >= this (hysteresis)
  min_mass: 0.6                     # ignore blobs lighter than this (single specks of marine snow)
  camera:
    port: flat                      # flat | dome | air | calibrated (after scripts/pi/calibrate_camera.py)
    hfov_deg: 102.0
    vfov_deg: 67.0
  controller:
    target_size: 0.22               # desired apparent size (sqrt of area fraction)
    standoff_size: 0.40             # back off above this
    max_surge: 0.4                  # keep approaches slow (~0.25 m/s disturbs animals less than 0.5 m/s; docs/SEARCH.md)
    max_yaw: 0.8
    release_backoff_s: 1.5          # moving on from an animal: back off this long ...
    release_turn_deg: 120           # ... then turn this far away from it (with a heading input) ...
    release_turn_s: 4.0             # ... or this long (without one) ...
    release_yaw: 0.6
    release_surge: 0.3              # ... then swim on for the rest of fsm.release_s
  fsm:
    frame_on: 0.6
    heat_on: 0.6
    acquire_n: 3
    acquire_m: 5
    lost_timeout_s: 4.0
    postroll_s: 3.0
    release_s: 12.0                 # length of the move-on manoeuvre (detections are ignored meanwhile)
  encounter:                        # how long to film each animal, and which ones were filmed (docs/SEARCH.md)
    rule: mvt                       # mvt: leave when more footage is worth less than searching on | fixed: max_s only
    tau_s: 30                       # footage of one animal is worth less and less: ~95% of its value after 3 x tau_s framed
    min_s: 10                       # film at least this long
    flee_s: 2                       # swimming away this long: stop approaching (it is never chased)
    max_s: 180                      # never longer than this (0 = no cap)
    giveup_s: 30                    # no good shot by then: move on
    novelty_bonus: 1.0              # an animal unlike those already filmed is worth up to 2x
    cooldown_s: 300                 # remember filmed animals this long (a recognised one is ignored)
    same_sim: 0.8                   # appearance similarity counted as "same animal"; calibrate with replay
    reid: true                      # recognise animals by appearance (needs an export with patch tokens)
  search:                           # where to look (docs/SEARCH.md); needs nav input for depth and heading
    strategy: adaptive              # adaptive | depth | legs | scan (the old turn-in-place)
    min_depth_m: 20                 # the band the planner may use (the autopilot enforces its own hard limits)
    max_depth_m: 200                # a lake shallower than this is fine: the profile stops at the bottom
    min_altitude_m: 5               # with an altimeter: never ask to go closer to the bottom than this ...
    floor_hold_s: 300               # ... and keep that limit this long when the sounder loses the bottom
    diel_prior: true                # dusk/dawn: favour the 100-200 m migration corridor; night: shallow
    sunrise_h: 6.5                  # sunrise and sunset at the dive site on the dive date, as times on
    sunset_h: 18.5                  # the Pi's clock (set the clock before the dive: docs/SEARCH.md)
    surge: 0.35                     # slow transect speed (~0.2 m/s; fast approaches scatter animals)
    leg_s: 600                      # a straight transect of ~10 min ...
    drift_s: 240                    # ... then a silent drift (no thrust) so shy fishes settle back
    hover_in_crossings: true        # dusk / dawn crossings: hover and let the migrating layer come to you ...
    hover_s: 420                    # ... 7 min at a time ...
    relocate_s: 150                 # ... then one slow leg out of the vehicle's own disturbance
    loop_s: 180                     # after a swarm or bloom: widening loops around the spot this long
    move_on_m: 40                   # after an animal that swam away: go this far before searching again
    layer_hold_s: 600               # after a drifter (jelly-like): keep to its depth this long
    giveup_s: 90                    # a find that did not become an encounter: short loops this long
  lights:                           # animals avoid light, red included; dim far-red disturbs least (docs/SEARCH.md)
    search: 0.0                     # lamp level while searching when the camera can see by ambient light ...
    search_dark: 0.3                # ... and when it cannot (frame brightness with the lamp off < dark_luma)
    dark_luma: 0.08                 # check on the vehicle: telemetry lights.ambient in dark and lit water
    check_s: 300                    # lamp on for darkness: while searching, switch it off this often to look for daylight
    track: null                     # close to an animal: null = no change (light coming on makes animals flee) ...
    near_size: 0.08                 # ... or a level to ramp up to once the animal is this big
    ramp_s: 5                       # an increase from off to full takes this long, never a sudden switch-on

  curiosity:                        # turn toward things worth a closer look while searching (docs/TWILIGHT_ZONE.md 7.4)
    flashes: true                   # bioluminescent flashes: brief local brightenings in blue-green
    weak: true                      # weak detections that stay in the same place for a few frames
    max_s: 12                       # look at most this long ...
    cooldown_s: 8                   # ... then search on for at least this long before the next look
    creep: 0.15                     # speed while closing in

nav:                                # depth / heading / turn rate from the autopilot bridge (docs/PI5.md section 5)
  kind: none                        # none | udp  (JSON datagrams: {"depth_m":..., "heading_deg":..., "yaw_rate_dps":...})
  port: 14601                       # also "altitude_m" (echosounder) and "temp_c"; senders may split fields (docs/SENSORS.md)

arming:                             # arm switch: the vehicle never thrusts on deck (docs/PI5.md section 4)
  kind: gpio                        # gpio (magnetic reed switch) | file (armed while `path` exists) | none (bench only)
  pin: 17                           # BCM GPIO 17 (header pin 11); the switch connects it to ground (pin 9)
  invert: false                     # true for a normally-closed switch
  arm_delay_s: 20                   # after the magnet goes on: time to put the vehicle in the water ...
  start_depth_m: 0.2                # ... then start once the nav input's depth is at least this (null: countdown only) ...
  start_hold_s: 3                   # ... for this long; magnet off at any time = thrusters stop

backends:
  - {kind: jsonl, path: logs/guidance.jsonl}
  - {kind: udp, host: 127.0.0.1, port: 14600}   # JSON commands for the autopilot bridge

encounter_log: logs/encounters.jsonl  # one line per animal: id, time spent, why it ended, video files
stats_every_s: 10
