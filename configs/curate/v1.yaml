# Curation for the first real training pool. Tune after reading reports/dataset/underwater_v1/report.md.
name: underwater_v1
root: data
sources: [fathomnet, noaa_oer, deepfish, kakadu, river_herring, brackish, ozfish, onc, own]
license_filter: none            # "commercial" keeps only images with train_commercial_ok
metrics_max_side: 256
thresholds: {}                  # BucketThresholds overrides (dark_lum, dim_lum, murky_clarity, ...)
thresholds_file: null           # written by: scripts/data/label_frames.py calibrate
calibrate: none                 # or "percentile" before you have labels
dedup:
  enabled: true
  max_hamming: 6
  max_thumb_dist: 1.2
empty_water:
  enabled: true
  keep_frac: {default: 0.15, murky: 0.5, dark: 0.5}   # keep more where faint animals hide
val_frac: 0.05
test_frac: 0.10
split_seed: 0
official_splits: []             # e.g. [deepfish] to use DeepFish's own splits instead of habitat-grouped
max_train_per_group: 4000       # cap frames per dive/video/deployment in the training pool
weight_cap: 8.0
source_max_frac:                # max share of the training sampling mass per source
  noaa_oer: 0.35
  fathomnet: 0.40
  river_herring: 0.15
  brackish: 0.10
seed: 0
