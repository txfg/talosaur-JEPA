name: vit_tiny               # 192-d, 12 blocks, 3 heads, 5.5 M params
init: scratch                # scratch | imagenet | /path/to/checkpoint.pt (e.g. a distilled encoder)
timm_name: vit_tiny_patch16_224.augreg_in21k_ft_in1k   # used when init=imagenet (Apache-2.0 AugReg weights)
drop_path_rate: 0.0
attn_impl: sdpa              # sdpa for training; export switches to math
grad_checkpointing: false
predictor:                   # narrow predictor (I-JEPA found a bottleneck helps); ablate dim/depth
  dim: 128
  depth: 6
  heads: 4
  mlp_ratio: 4.0
