kind: index
index: data/index/underwater_v1.parquet    # from scripts/data/build_dataset.py
root: data
weighted: true               # curation weights balance light x clarity buckets and cap sources
license_filter: none         # "commercial" trains only on images with train_commercial_ok
sources: null                # optional subset, e.g. [fathomnet, noaa_oer]
samples_per_epoch: null      # default: number of training images
crop_scale: [0.3, 1.0]       # I-JEPA random-resized-crop scale; no other augmentation
hflip: 0.0
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]
